<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Join a game · MtG Life Tracker</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f1e4; --fg: #1e0a00; --muted: #5a3010; --accent: #15254a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17130d; --fg: #f1e6cc; --muted: #c9b38a; --accent: #9fb4e6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           box-sizing: border-box; background: var(--bg); color: var(--fg);
           font: 16px/1.5 Georgia, "Times New Roman", serif; text-align: center; }
    main { max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    .code { font: 700 2.2rem/1.2 ui-monospace, Menlo, monospace; letter-spacing: .15em; margin: 1rem 0; }
    a.button { display: inline-block; padding: .75rem 1.5rem; border-radius: 999px;
               background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 700; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Join a game of MtG Life Tracker</h1>
    <div id="invite" hidden>
      <div class="code" id="code"></div>
      <p><a class="button" id="open">Open in the app</a></p>
      <p>If nothing happens, open MtG Life Tracker and enter the code above.</p>
      <p>No app? <a id="web">Play in your browser</a>.</p>
    </div>
    <p id="invalid" hidden>This invite link is incomplete. Ask for the session code instead.</p>
    <p>Don't have the app? Download the latest APK from
      <a href="https://github.com/kregosh/MtGLifeTracker/releases">GitHub releases</a>.</p>
  </main>
  <script>
    (function () {
      var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
      if (!/^[A-Z0-9]{6,8}$/.test(code)) {
        document.getElementById('invalid').hidden = false;
        return;
      }
      var appLink = 'mtgtracker://join/' + code;
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = appLink;
      var webLink = '../app/?code=' + code;
      document.getElementById('web').href = webLink;
      document.getElementById('invite').hidden = false;
      // There's no iPhone app, so iPhones go straight to the browser version.
      location.href = /iPhone|iPad|iPod/.test(navigator.userAgent) ? webLink : appLink;
    })();
  </script>
</body>
</html>
