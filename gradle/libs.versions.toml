[versions]
kotlin          = "2.4.21"
agp             = "9.4.1"
coroutines      = "1.11.0"
coreKtx         = "1.19.1"
lifecycle       = "2.9.4"
activityCompose = "1.10.0"
# The same Compose as the browser build (web/): Compose Multiplatform 1.12.1 is built on
# Jetpack Compose 1.12.1, its Material 3 on 1.9.0.
compose          = "1.12.1"
composeMaterial3 = "1.9.0"
composeIcons     = "1.7.3"
firebase-bom    = "33.7.0"
google-services = "4.5.0"

[libraries]
# ── Firebase ─────────────────────────────────────────────────────────
firebase-bom                     = { module = "com.google.firebase:firebase-bom",                        version.ref = "firebase-bom" }
firebase-database                = { module = "com.google.firebase:firebase-database" }
firebase-auth                    = { module = "com.google.firebase:firebase-auth" }

# ── Coroutines ───────────────────────────────────────────────────────
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# ── Jetpack ──────────────────────────────────────────────────────────
core-ktx                    = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
lifecycle-viewmodel         = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
activity-compose            = { group = "androidx.activity",          name = "activity-compose",             version.ref = "activityCompose" }
# Compose Multiplatform coordinates, so Android gets the same versions as the browser
# build; on Android they resolve to the matching Jetpack Compose artifacts.
compose-ui                  = { group = "org.jetbrains.compose.ui",        name = "ui",                      version.ref = "compose" }
compose-material3           = { group = "org.jetbrains.compose.material3", name = "material3",               version.ref = "composeMaterial3" }
compose-icons-extended      = { group = "org.jetbrains.compose.material",  name = "material-icons-extended", version.ref = "composeIcons" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",             name = "ui-tooling-preview",      version.ref = "compose" }
compose-ui-tooling          = { group = "androidx.compose.ui",             name = "ui-tooling",              version.ref = "compose" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",             name = "ui-test-junit4",          version.ref = "compose" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",             name = "ui-test-manifest",        version.ref = "compose" }

# ── Invite QR codes ──────────────────────────────────────────────────
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }

# ── Test ─────────────────────────────────────────────────────────────
mockk                   = { group = "io.mockk",              name = "mockk",                   version = "1.14.11" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric             = { group = "org.robolectric",        name = "robolectric",              version = "4.17" }
androidx-test-core      = { group = "androidx.test",           name = "core-ktx",                 version = "1.6.1" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
android-library     = { id = "com.android.library",                  version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",       version.ref = "google-services" }
