[versions]
kotlin        = "2.0.21"
agp           = "8.7.3"
ktor          = "3.0.3"
serialization = "1.7.3"
coroutines    = "1.9.0"
logback       = "1.5.12"
coreKtx       = "1.15.0"
lifecycle     = "2.8.7"
activityCompose = "1.10.0"
composeBom    = "2024.12.01"

[libraries]
# ── Shared ───────────────────────────────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }

# ── Backend ──────────────────────────────────────────────────────────
ktor-server-core                    = { group = "io.ktor", name = "ktor-server-core",                    version.ref = "ktor" }
ktor-server-netty                   = { group = "io.ktor", name = "ktor-server-netty",                   version.ref = "ktor" }
ktor-server-cio                     = { group = "io.ktor", name = "ktor-server-cio",                     version.ref = "ktor" }
ktor-server-websockets              = { group = "io.ktor", name = "ktor-server-websockets",              version.ref = "ktor" }
ktor-server-content-negotiation     = { group = "io.ktor", name = "ktor-server-content-negotiation",     version.ref = "ktor" }
ktor-server-cors                    = { group = "io.ktor", name = "ktor-server-cors",                    version.ref = "ktor" }
ktor-server-call-logging            = { group = "io.ktor", name = "ktor-server-call-logging",            version.ref = "ktor" }
ktor-serialization-kotlinx-json     = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",     version.ref = "ktor" }
logback-classic                     = { group = "ch.qos.logback", name = "logback-classic",              version.ref = "logback" }

# ── Android / Ktor client ────────────────────────────────────────────
ktor-client-core                    = { group = "io.ktor", name = "ktor-client-core",                    version.ref = "ktor" }
ktor-client-okhttp                  = { group = "io.ktor", name = "ktor-client-okhttp",                  version.ref = "ktor" }
ktor-client-websockets              = { group = "io.ktor", name = "ktor-client-websockets",              version.ref = "ktor" }
ktor-client-content-negotiation     = { group = "io.ktor", name = "ktor-client-content-negotiation",     version.ref = "ktor" }
ktor-client-logging                 = { group = "io.ktor", name = "ktor-client-logging",                 version.ref = "ktor" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
core-ktx                            = { group = "androidx.core",           name = "core-ktx",                    version.ref = "coreKtx" }
lifecycle-runtime-ktx               = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
lifecycle-viewmodel-compose         = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
activity-compose                    = { group = "androidx.activity",       name = "activity-compose",            version.ref = "activityCompose" }
compose-bom                         = { group = "androidx.compose",        name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                          = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-tooling-preview          = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling                  = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-material3                   = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended              = { group = "androidx.compose.material", name = "material-icons-extended" }

mockk                           = { group = "io.mockk",              name = "mockk",                            version = "1.13.12" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
ktor-server-test-host           = { group = "io.ktor",               name = "ktor-server-test-host",              version.ref = "ktor" }

[plugins]
android-application   = { id = "com.android.application",                     version.ref = "agp" }
android-library       = { id = "com.android.library",                          version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                 version.ref = "kotlin" }
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",                     version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",    version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",          version.ref = "kotlin" }
