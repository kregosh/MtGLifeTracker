[versions]
kotlin          = "2.0.21"
agp             = "8.7.3"
coroutines      = "1.9.0"
coreKtx         = "1.15.0"
lifecycle       = "2.8.7"
activityCompose = "1.10.0"
composeBom      = "2024.12.01"
firebase-bom    = "33.7.0"
google-services = "4.4.2"

[libraries]
# ── Firebase ─────────────────────────────────────────────────────────
firebase-bom                     = { module = "com.google.firebase:firebase-bom",                        version.ref = "firebase-bom" }
firebase-database                = { module = "com.google.firebase:firebase-database-ktx" }
firebase-auth                    = { module = "com.google.firebase:firebase-auth-ktx" }

# ── Coroutines ───────────────────────────────────────────────────────
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# ── Jetpack ──────────────────────────────────────────────────────────
core-ktx                    = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
lifecycle-viewmodel         = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
activity-compose            = { group = "androidx.activity",          name = "activity-compose",             version.ref = "activityCompose" }
compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended      = { group = "androidx.compose.material",  name = "material-icons-extended" }

# ── Test ─────────────────────────────────────────────────────────────
mockk                   = { group = "io.mockk",              name = "mockk",                   version = "1.13.12" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric             = { group = "org.robolectric",        name = "robolectric",              version = "4.14.1" }
androidx-test-core      = { group = "androidx.test",           name = "core-ktx",                 version = "1.6.1" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
android-library     = { id = "com.android.library",                  version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",       version.ref = "google-services" }
