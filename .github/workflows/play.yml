name: Play release

# Builds the Android App Bundle (.aab) for Google Play, signed with the upload key, and attaches
# it to a draft GitHub release to download and upload in the Play Console. Run it by hand from
# the Actions tab ("Run workflow").
#
# Needs these repository secrets, besides GOOGLE_SERVICES_JSON:
#   UPLOAD_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  its store password
#   UPLOAD_KEY_ALIAS          the key's alias in it
#   UPLOAD_KEY_PASSWORD       the key's password

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to testers, e.g. 0.1.0"
        required: true
        default: "0.1.0"

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  bundle:
    name: Build & sign the Play bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the draft release
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      # Play needs a higher version code for every upload; this workflow's run counter is one.
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Use the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set; see the top of .github/workflows/play.yml."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the release bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS:         ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD:      ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease

      # Play rejects a bundle signed with any other key than the registered upload key.
      - name: Check the bundle is signed with the upload key
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS:         ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          fingerprint() { awk '/SHA256:/ { print $2; exit }'; }
          expected=$(keytool -list -v -keystore "$UPLOAD_KEYSTORE" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" | fingerprint)
          actual=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | fingerprint)
          echo "upload key $expected, bundle signed with $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: Name the files after the version
        run: |
          out="mtg-life-tracker-$VERSION_NAME-$VERSION_CODE"
          mkdir -p play
          mv app/build/outputs/bundle/release/app-release.aab "play/$out.aab"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: play-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          name: "Play ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          draft: true
          body: |
            Built from `${{ github.sha }}` for Google Play: version ${{ env.VERSION_NAME }}, version code ${{ env.VERSION_CODE }}.

            1. Download `${{ env.OUT }}.aab`.
            2. Play Console → the app → Testing → Internal testing → Create new release → upload it.

            The bundle carries the R8 mapping, so Play shows crash reports readable.
          files: play/${{ env.OUT }}.aab
