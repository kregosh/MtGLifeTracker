name: CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Backend (pure JVM, no Android SDK needed) ────────────────────────────
  backend:
    name: Backend – compile & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile shared + backend
        working-directory: backend
        run: ../gradlew --no-daemon :shared:compileKotlin compileKotlin

      - name: Run backend tests
        working-directory: backend
        run: ../gradlew --no-daemon test

      - name: Build fat jar
        working-directory: backend
        run: ../gradlew --no-daemon jar

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  # ── Android app (requires SDK, longer job) ──────────────────────────────
  android:
    name: Android – compile & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile app (debug)
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Run unit tests
        run: ./gradlew --no-daemon :shared:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
