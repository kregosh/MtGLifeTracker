name: CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android:
    name: Android – compile & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile app (debug)
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Run unit tests (all modules)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (all modules)
        run: ./gradlew --no-daemon lintDebug

      - name: Build minified release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/lint-results-debug.html
            */build/reports/tests/

  rules:
    name: Firebase rules tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Set up JDK 17 (database emulator)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install
        working-directory: rules-tests
        run: npm ci

      - name: Test database.rules.json against the emulator
        working-directory: rules-tests
        run: npm test
