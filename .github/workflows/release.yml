name: Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update releases

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/mtg-life-tracker-${SHORT_SHA}.apk
          echo "APK_NAME=mtg-life-tracker-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Latest debug build"
          body: |
            Auto-built from `main` @ ${{ github.sha }}

            **Install:** download the APK, open it on your Android phone.
            You may need to allow installs from unknown sources in Settings → Security.
          prerelease: true
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
