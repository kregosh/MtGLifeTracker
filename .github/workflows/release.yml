name: Release APK

on:
  push:
    branches: [ "main" ]

# Serialize runs so two prunes can't race each other
concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update releases

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Android only installs an update signed with the same key as the installed app. A fresh
      # runner would generate a new debug key every time, so every APK would need an uninstall.
      # The key is the default debug keystore (store/key password "android", alias
      # "androiddebugkey"), kept base64-encoded in the DEBUG_KEYSTORE_BASE64 secret;
      # app/build.gradle.kts signs with it when DEBUG_KEYSTORE names it.
      - name: Use the stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set: the APK would get a throwaway key and not install over the previous build."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Publishing an APK signed with any other key would break updates for everyone again.
      - name: Check the APK is signed with the stable key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          expected=$(keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey \
                     | awk '/SHA256:/ { print $2; exit }' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                   | awk '/certificate SHA-256 digest:/ { print $NF; exit }')
          echo "expected $expected, signed with $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/mtg-life-tracker-${SHORT_SHA}.apk
          echo "APK_NAME=mtg-life-tracker-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Create debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Debug build #${{ github.run_number }}"
          body: |
            Auto-built from `main` @ ${{ github.sha }}

            **Install:** download the APK, open it on your Android phone.
            You may need to allow installs from unknown sources in Settings → Security.
          prerelease: true
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}

      - name: Keep only the last 3 debug releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Old single rolling release, superseded by per-build releases
          gh release delete latest-debug --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("debug-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old release $tag"
              gh release delete "$tag" --cleanup-tag --yes -R "$GITHUB_REPOSITORY"
            done
