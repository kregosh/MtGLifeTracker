name: Release APK

on:
  push:
    branches: [ "main" ]

# Serialize runs so two prunes can't race each other
concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update releases

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/mtg-life-tracker-${SHORT_SHA}.apk
          echo "APK_NAME=mtg-life-tracker-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Create debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Debug build #${{ github.run_number }}"
          body: |
            Auto-built from `main` @ ${{ github.sha }}

            **Install:** download the APK, open it on your Android phone.
            You may need to allow installs from unknown sources in Settings → Security.
          prerelease: true
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}

      - name: Keep only the last 3 debug releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Old single rolling release, superseded by per-build releases
          gh release delete latest-debug --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("debug-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old release $tag"
              gh release delete "$tag" --cleanup-tag --yes -R "$GITHUB_REPOSITORY"
            done
