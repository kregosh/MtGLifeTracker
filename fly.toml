# fly.toml — Fly.io app configuration for the MtG Life Tracker backend
# Run `fly launch --no-deploy` to register the app, then `fly deploy` to ship.

app = "mtg-life-tracker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
