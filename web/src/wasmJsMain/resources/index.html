<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>MtG Life Tracker</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    /* Keep the app clear of the iPhone's notch and home indicator. */
    /* --visible-* follow the part of the screen the on-screen keyboard leaves free (set below). */
    #app {
      position: fixed;
      top: calc(var(--visible-top, 0px) + env(safe-area-inset-top, 0px));
      height: calc(var(--visible-height, 100%) - env(safe-area-inset-top, 0px) - var(--bottom-inset, env(safe-area-inset-bottom, 0px)));
      left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    }
  </style>
  <!-- Written by the Pages deploy from a repository secret; sets window.MTG_FIREBASE_CONFIG. -->
  <script src="firebase-config.js"></script>
  <script src="mtglifetracker.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // iPhones lay the keyboard over the page instead of shrinking it, which would hide the
    // buttons of a dialog. Fit the app to the visible part instead, so dialogs centre above
    // the keyboard; while it's open the home-indicator inset doesn't apply.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var root = document.documentElement.style;
      function fit() {
        var keyboardOpen = window.innerHeight - vv.height > 100;
        root.setProperty('--visible-top', vv.offsetTop + 'px');
        root.setProperty('--visible-height', vv.height + 'px');
        root.setProperty('--bottom-inset', keyboardOpen ? '0px' : 'env(safe-area-inset-bottom, 0px)');
        // Compose re-measures its canvas on window resizes, which the keyboard doesn't cause.
        window.dispatchEvent(new Event('resize'));
      }
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      fit();
    })();
  </script>
</body>
</html>
